bundle:
  name: tabular_fm_databricks

variables:
  project_name:
    description: "Name of the project"
    default: "tabular-fm-databricks"
  # Passed by the org CI workflow via --var="environment=dev". Also usable locally.
  environment:
    description: "Deployment environment (dev, staging, prod)"
    default: "dev"

targets:
  dev:
    default: true
    mode: development
    # No workspace profile pinned here: CI authenticates via ~/.databrickscfg [DEFAULT]
    # (DATABRICKS_HOST/TOKEN). For local deploys, pass --profile e2-demo-field-eng-west.

# Files synced to the workspace when the bundle is deployed.
sync:
  include:
    - "shared/notebooks/*.ipynb"
    - "shared/scripts/**"
    - "common/**"
    - "vendors/**/notebooks/*.ipynb"

# CI smoke workflow. The org CI runs `databricks bundle run demo_workflow`, so the
# job resource key below MUST stay `demo_workflow`. It runs only the data-preparation
# notebook, which is self-contained (serverless CPU, creates its own catalog/schema
# and Delta tables) and needs no GPU or external credentials — so it exercises the
# accelerator on CI's serverless compute. The GPU vendor notebooks (TabFM/TabICL)
# and the hosted TabPFN notebooks are run interactively, not in CI.
resources:
  jobs:
    demo_workflow:
      name: "${var.project_name} - CI smoke (data preparation)"
      tasks:
        - task_key: data_preparation
          notebook_task:
            notebook_path: "./shared/notebooks/00_data_preparation.ipynb"
